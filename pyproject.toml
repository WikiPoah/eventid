[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "migrations/versions"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]

[tool.coverage.run]
source = ["app"]
omit = ["migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.pytest.ini_options]
testpaths = ["tests"]
