<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Events</title>
</head>

<body>
    <h1>My Events</h1>

    <!-- Display only events the current user is registered to attend -->
    {% if events %}
        {% for event in events %}
            {% include "event_card.html" %}
        {% endfor %}
    {% else %}
        <p>You are not registered to attend any events yet.</p>
        <p><a href="{{ url_for('events.browse_events') }}">Browse public events</a></p>
    {% endif %}
</body>

</html>
