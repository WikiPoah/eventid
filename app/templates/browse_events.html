<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Events</title>
</head>

<body>

    <h1>Browse Events</h1>

    <!-- Display all public events that are available to browse -->
    {% if events %}

        {% for event in events %}

            {% include "event_card.html" %}

        {% endfor %}

    {% else %}

        <!-- Inform the user when no public events are available -->
        <p>There are currently no public events.</p>

    {% endif %}

</body>

</html>
